name: Leaderboard
on:
  pull_request:
    paths: ["leaderboard/submissions/*.json"]
  push:
    paths: ["leaderboard/submissions/*.json"]
  workflow_dispatch:

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate submission
        run: python3 scripts/validate_leaderboard.py leaderboard/submissions/*.json
      - name: Merge into results
        run: python3 scripts/merge_leaderboard.py
      - name: Commit results
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@ambench.dev"
          git add leaderboard/results.json
          git commit -m "Update leaderboard with new submission"
          git push
