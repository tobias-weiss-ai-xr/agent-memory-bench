name: Docker build

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'requirements.txt'
      - 'src/**'
  pull_request:
    paths:
      - 'docker/**'
      - 'requirements.txt'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose -f docker/docker-compose.yml build
      - name: Verify container starts
        run: docker compose -f docker/docker-compose.yml run --rm ambench --help
