<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMBench — Agent Memory Benchmark</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #3fb950; --orange: #d29922; --red: #f85149; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  
  header { text-align: center; padding: 40px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
  header h1 { font-size: 2.5em; margin-bottom: 10px; }
  header p { color: #8b949e; font-size: 1.1em; }
  header .badges { margin: 15px 0; }
  header .badges img { height: 20px; margin: 2px; }
  
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; }
  .stat-card .value { font-size: 2em; font-weight: bold; color: var(--accent); }
  .stat-card .label { font-size: 0.85em; color: #8b949e; margin-top: 5px; }
  
  .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .controls input, .controls select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
  .controls input { flex: 1; min-width: 200px; }
  
  .cell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-bottom: 30px; }
  .cell-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; cursor: pointer; transition: border-color 0.2s; }
  .cell-card:hover { border-color: var(--accent); }
  .cell-card .name { font-weight: 600; }
  .cell-card .count { font-size: 0.9em; color: #8b949e; }
  .cell-card .bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .cell-card .bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .cell-card .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin: 2px; }
  .tag-domain { background: #1f6feb33; color: #58a6ff; }
  .tag-factual { background: #3fb95033; color: #3fb950; }
  .tag-experiential { background: #d2992233; color: #d29922; }
  .tag-working { background: #f8514933; color: #f85149; }
  
  .task-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  .task-table th, .task-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .task-table th { color: #8b949e; font-weight: 600; font-size: 0.85em; }
  .task-table tr:hover { background: var(--card); }
  
  .diff-1 { color: var(--green); } .diff-2 { color: var(--green); } .diff-3 { color: var(--orange); }
  .diff-4 { color: var(--red); } .diff-5 { color: var(--red); font-weight: bold; }
  
  footer { text-align: center; padding: 30px; color: #8b949e; font-size: 0.9em; border-top: 1px solid var(--border); margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔬 AMBench</h1>
    <p>Unified Benchmark for Agent Memory Systems</p>
    <div class="badges">
      <img src="https://img.shields.io/badge/License-MIT-yellow.svg" alt="MIT">
      <img src="https://img.shields.io/github/actions/workflow/status/tobias-weiss-ai-xr/agent-memory-bench/validate.yml?label=CI" alt="CI">
      <img src="https://img.shields.io/badge/Leaderboard-Open-004D40.svg" alt="Leaderboard">
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search tasks by ID, cell, or tag..." oninput="render()">
    <select id="cellFilter" onchange="render()">
      <option value="">All cells</option>
    </select>
    <select id="diffFilter" onchange="render()">
      <option value="">All difficulties</option>
      <option value="1">Level 1 (basic)</option>
      <option value="2">Level 2</option>
      <option value="3">Level 3</option>
      <option value="4">Level 4</option>
      <option value="5">Level 5 (complex)</option>
    </select>
  </div>

  <div id="taskList"></div>
  
  <footer>
    <p>AMBench v0.1 — <a href="https://github.com/tobias-weiss-ai-xr/agent-memory-bench" style="color: var(--accent)">GitHub</a> · 
    <a href="docs/specification.md" style="color: var(--accent)">Specification</a> · 
    <a href="docs/leaderboard.md" style="color: var(--accent)">Leaderboard</a></p>
  </footer>
</div>

<script>
const dataUrl = 'data.json';

async function load() {
  const resp = await fetch(dataUrl);
  const data = await resp.json();
  
  renderStats(data);
  populateFilter(data);
  window._data = data;
  render();
}

function renderStats(data) {
  const cells = Object.values(data.cells).reduce((a,b) => a+b, 0);
  const core = Object.entries(data.cells).filter(([k]) => k.split('/').length === 3).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="value">${data.total_tasks}</div><div class="label">Total Tasks</div></div>
    <div class="stat-card"><div class="value">${core}</div><div class="label">Core Cells Covered</div></div>
    <div class="stat-card"><div class="value">${Object.keys(data.cells).length}</div><div class="label">Total Cell Groups</div></div>
    <div class="stat-card"><div class="value">${data.tasks.filter(t => t.difficulty >= 4).length}</div><div class="label">Hard Tasks (4-5)</div></div>
    <div class="stat-card"><div class="value">${data.tasks.filter(t => t.modality !== 'text').length}</div><div class="label">Multimodal Tasks</div></div>
    <div class="stat-card"><div class="value">${[...new Set(data.tasks.flatMap(t => t.tags))].length}</div><div class="label">Unique Tags</div></div>
  `;
}

function populateFilter(data) {
  const cells = [...new Set(data.tasks.map(t => t.cell))].sort();
  const sel = document.getElementById('cellFilter');
  cells.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function tagClass(cell) {
  if (cell.startsWith('factual')) return 'tag-factual';
  if (cell.startsWith('experiential')) return 'tag-experiential';
  if (cell.startsWith('working')) return 'tag-working';
  return 'tag-domain';
}

function render() {
  const data = window._data;
  if (!data) return;
  
  const q = document.getElementById('search').value.toLowerCase();
  const cellF = document.getElementById('cellFilter').value;
  const diffF = document.getElementById('diffFilter').value;
  
  const filtered = data.tasks.filter(t => {
    if (cellF && t.cell !== cellF) return false;
    if (diffF && t.difficulty !== parseInt(diffF)) return false;
    if (q && !t.id.toLowerCase().includes(q) && !t.cell.toLowerCase().includes(q) && !t.tags.some(tg => tg.toLowerCase().includes(q))) return false;
    return true;
  });
  
  const byCell = {};
  filtered.forEach(t => {
    if (!byCell[t.cell]) byCell[t.cell] = [];
    byCell[t.cell].push(t);
  });
  
  let html = '<table class="task-table"><tr><th>ID</th><th>Cell</th><th>Difficulty</th><th>Modality</th><th>Tags</th></tr>';
  Object.entries(byCell).sort().forEach(([cell, tasks]) => {
    tasks.forEach(t => {
      html += `<tr>
        <td><strong>${t.id}</strong></td>
        <td><span class="tag ${tagClass(cell)}">${cell}</span></td>
        <td class="diff-${t.difficulty}">${'★'.repeat(t.difficulty)}${'☆'.repeat(5-t.difficulty)}</td>
        <td>${t.modality}</td>
        <td>${t.tags.slice(0,3).map(tg => `<span class="tag ${tagClass(cell)}">${tg}</span>`).join(' ')}</td>
      </tr>`;
    });
  });
  html += '</table>';
  html += `<p style="margin-top:10px;color:#8b949e">${filtered.length} tasks shown</p>`;
  
  document.getElementById('taskList').innerHTML = html;
}

load();
</script>
</body>
</html>
