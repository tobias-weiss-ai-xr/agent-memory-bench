[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ambench"
version = "0.1.0"
description = "Unified benchmark for agent memory systems"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
api = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
